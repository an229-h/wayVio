services:
  database:
    image: postgres:15-alpine
    container_name: tracker_postgres_engine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_production_volume:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - telemetry_network

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: tracker_fastapi_api
    restart: always

    depends_on:
      - database

    ports:
      - "8000:8000"

    networks:
      - telemetry_network

  reverse_proxy:
    image: nginx:alpine
    container_name: tracker_nginx_ingress
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend_api
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - telemetry_network

volumes:
  postgres_production_volume:

networks:
  telemetry_network:
    driver: bridge